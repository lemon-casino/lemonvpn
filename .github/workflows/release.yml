name: Build and publish desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build and publish (v0.1.32 or v0.1.32-rc.1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.15.1'
  CARGO_BUILD_JOBS: '2'
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Validate tag and prepare build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      matrix: ${{ steps.release.outputs.matrix }}
      doona_revision: ${{ steps.release.outputs.doona_revision }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Resolve immutable tag commit and pinned inputs
        id: release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node app/scripts/release.mjs prepare

  build:
    name: Build ${{ matrix.id }} (unsigned)
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
      BUILD_TARGET: ${{ matrix.target }}
      BUILD_BUNDLES: ${{ matrix.bundles }}
      # Packaging tools may use AppImages on runners without a FUSE mount.
      APPIMAGE_EXTRACT_AND_RUN: '1'
      NO_COLOR: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: Zakkaus/doona
          ref: ${{ needs.prepare.outputs.doona_revision }}
          path: doona
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Apply complete desktop frontend patch
        run: git -C doona apply --binary --whitespace=nowarn ../patches/doona-lemonvpn-desktop.patch
      - name: Stamp tag version into shell and lockfile
        run: node app/scripts/release.mjs stamp
      - name: Install pinned pnpm and locked dependencies
        run: |
          npm install --global "pnpm@$PNPM_VERSION" --ignore-scripts
          pnpm --dir app install --frozen-lockfile
          pnpm --dir doona install --frozen-lockfile
      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2t64 file xdg-utils
      - name: Prepare Windows MSVC and Clang for the target architecture
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./app/scripts/windows-toolchain.ps1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: |
            app/src-tauri -> target
            sidecar-stub -> target
          key: desktop-release-${{ matrix.target }}-${{ hashFiles('pins.env', 'app/scripts/bundler-tools.json') }}
          cache-directories: |
            app/src-tauri/target/compat-cache
            app/src-tauri/target/geodata-cache
            app/src-tauri/target/bundler-cache
          cache-on-failure: true
      - name: Prepare verified official packaging tools with download fallback
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node app/scripts/prepare-bundler.mjs
      - name: Build unsigned installers (no tests or app launch)
        if: matrix.platform != 'windows'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm --dir app build --verbose --target "$BUILD_TARGET" --bundles "$BUILD_BUNDLES" --no-sign --ci -- --locked \
            2>&1 | tee "$RUNNER_TEMP/lemonvpn-build.log"
      - name: Build unsigned Windows installer (no tests or app launch)
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: app
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          & node node_modules/@tauri-apps/cli/tauri.js build --verbose --target $env:BUILD_TARGET --bundles $env:BUILD_BUNDLES --no-sign --ci '--' '--locked' 2>&1 |
            Tee-Object -FilePath "$env:RUNNER_TEMP\lemonvpn-build.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify architecture and collect packages with checksums
        run: node app/scripts/release.mjs collect
      - name: Upload this platform's complete packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lemonvpn-${{ matrix.id }}
          path: output/release/${{ matrix.id }}/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Keep compiler log on failure
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: build-log-${{ matrix.id }}
          path: ${{ runner.temp }}/lemonvpn-build.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish complete GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: lemonvpn-*
          path: output/downloaded
      - name: Verify all six builds, upload to draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: node app/scripts/release.mjs publish
