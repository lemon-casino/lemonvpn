name: Docker image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (v0.1.41)
        required: true
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          # GitHub-hosted arm64 runner. On a repository without ARM runners,
          # switch this leg to ubuntu-24.04 with QEMU (much slower).
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Resolve build inputs
        id: meta
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          revision="$(sed -n 's/^DOONA_DESKTOP_REVISION=//p' pins.env | tr -d '\r')"
          image="$(printf '%s' 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          test -n "$revision" || { echo "missing DOONA_DESKTOP_REVISION in pins.env" >&2; exit 1; }
          {
            echo "version=$version"
            echo "revision=$revision"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-${{ matrix.arch }}
          build-args: |
            DOONA_REVISION=${{ steps.meta.outputs.revision }}
            LEMONVPN_VERSION=${{ steps.meta.outputs.version }}
            NPM_REGISTRY=https://registry.npmjs.org
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # Keep the per-arch manifest unencumbered so it can be merged below.
          provenance: false
          sbom: false

      - name: Smoke test proxy mode (amd64)
        if: matrix.arch == 'amd64'
        run: |
          set -euo pipefail
          docker pull "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-amd64"
          ./docker/smoke.sh "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}-amd64"

      - name: Record digest
        run: |
          printf '%s' '${{ steps.build.outputs.digest }}' > "digest-${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digest-${{ matrix.arch }}.txt

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve tags
        id: meta
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          image="$(printf '%s' 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          {
            echo "version=$version"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create version and latest manifests
        run: |
          set -euo pipefail
          image="${{ steps.meta.outputs.image }}"
          version="${{ steps.meta.outputs.version }}"
          amd64="$(cat digests/digest-amd64.txt)"
          arm64="$(cat digests/digest-arm64.txt)"
          docker buildx imagetools create \
            -t "$image:$version" \
            -t "$image:latest" \
            "$image@$amd64" \
            "$image@$arm64"
          docker buildx imagetools inspect "$image:$version"
