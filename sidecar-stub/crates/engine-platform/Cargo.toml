[package]
name = "lemonvpn-engine-platform"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.2"

[target.'cfg(windows)'.dependencies]
windows-support = { package = "windows-sys", version = "0.61", features = [
  "Win32_Foundation", "Win32_System_Registry", "Win32_Networking_WinInet",
  "Win32_System_Threading",
  "Win32_System_Console",
  "Win32_System_JobObjects", "Win32_Security", "Win32_Security_Authorization",
  "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO",
  "Win32_Security_Cryptography",
  "Win32_System_SystemInformation",
] }
windows-service = "0.8"
socket2 = "0.6"
wintun = "0.5"
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
socket2 = "0.6"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
socket2 = { version = "0.6", features = ["all"] }
