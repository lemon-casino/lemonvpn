[package]
name = "lemonvpn-engine-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies]
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
lemonvpn-engine-platform = { path = "../engine-platform" }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12", "logging"] }
webpki-roots = "0.26"
ring = "0.17"
aes = "0.8"
md-5 = "0.10"
sha3 = "0.10"
tokio = { version = "1", default-features = false, features = ["rt", "sync", "net", "io-util", "time"] }
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "socket-udp"] }

[dev-dependencies]
rcgen = "0.13"
