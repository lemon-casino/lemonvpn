[package]
name = "lemonvpn"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Production builds serve the embedded `frontendDist`; without this the binary
# keeps loading `build.devUrl` (localhost:5173) even in release mode.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Registry",
  "Win32_Networking_WinInet",
] }
