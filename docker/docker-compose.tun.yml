# Host-wide TUN mode for Linux hosts. This container shares the host network
# namespace and needs NET_ADMIN plus /dev/net/tun, so it can change host routes.
# Do not run it together with the desktop LemonVPN TUN mode.
#
#   docker compose -f docker-compose.tun.yml up -d
#
# LAN subnets are kept on the physical route by default (LEMONVPN_TUN_EXCLUDE_LAN),
# so the Web UI, proxy clients and SSH remain reachable while TUN is active.
services:
  lemonvpn:
    image: ${LEMONVPN_IMAGE:-ghcr.io/lemon-casino/lemonvpn:latest}
    container_name: lemonvpn
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - ./data:/data
    environment:
      LEMONVPN_UI_USERNAME: ${LEMONVPN_UI_USERNAME:-admin}
      LEMONVPN_UI_PASSWORD: ${LEMONVPN_UI_PASSWORD:-}
      LEMONVPN_LAN_ENABLED: "1"
      LEMONVPN_LAN_BIND: "0.0.0.0"
      LEMONVPN_LAN_PORT: ${LEMONVPN_LAN_PORT:-18081}
      LEMONVPN_LAN_USERNAME: ${LEMONVPN_LAN_USERNAME:-}
      LEMONVPN_LAN_PASSWORD: ${LEMONVPN_LAN_PASSWORD:-}
      LEMONVPN_TUN: "1"
      LEMONVPN_TUN_STRICT: "1"
      LEMONVPN_TUN_EXCLUDE_LAN: "1"
      TZ: ${TZ:-UTC}
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
