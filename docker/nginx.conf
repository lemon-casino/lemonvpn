worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /tmp/nginx-access.log;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    auth_basic "LemonVPN";
    auth_basic_user_file /run/nginx-auth/htpasswd;

    # The engine closes every response; SSE streams must not be buffered.
    location /api {
      proxy_pass http://127.0.0.1:18080;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location = /index.html {
      add_header Cache-Control "no-store" always;
      auth_basic "LemonVPN";
      auth_basic_user_file /run/nginx-auth/htpasswd;
    }

    location = /sw.js {
      add_header Cache-Control "no-store" always;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
